<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>

  <style>
    button {
      margin: 3px;
    }

    button:hover {
      cursor: pointer;
    }

    #first-num,
    #second-num {
      width: 60px;
    }

    output {
      border: 1px solid gray;
      display: block;
      height: 18px;
      margin-top: 5px;
      padding: 5px;
      width: 240px;
    }

    main {
      width: 800px;
    }

    #error-btns {
      column-gap: 5px;
      display: flex;
      flex-wrap: wrap;
      margin-top: 30px;
      row-gap: 5px;
    }

    #error-btns>* {
      padding: 8px 2px;
      width: 122px;
    }
  </style>

  <script src="https://cdn.trackjs.com/agent/v3/latest/t.js"></script>
<script>
  window.TrackJS && TrackJS.install({ 
    token: "af7c4be7585b481e927fb8032dba21c3"
    // for more configuration options, see https://docs.trackjs.com
  });
</script>

</head>

<body>
  <main>
    <form>
      <fieldset>
        <legend>Error Calculator</legend>
        <input name="first-num" id="first-num" />
        <select name="operator" id="operator">
          <option>+</option>
          <option>-</option>
          <option>*</option>
          <option>/</option>
        </select>
        <input name="second-num" id="second-num" />
        <button id="calculate">Calculate</button>
        <br />
        <output></output>
      </fieldset>
    </form>

    <section id="error-btns">
      <button>Console Log</button>
      <button>Console Error</button>
      <button>Console Count</button>
      <button>Console Warn</button>
      <button>Console Assert</button>
      <button>Console Clear</button>
      <button>Console Dir</button>
      <button>Console dirxml</button>
      <button>Console Group Start</button>
      <button>Console Group End</button>
      <button>Console Table</button>
      <button>Start Timer</button>
      <button>End Timer</button>
      <button>Console Trace</button>
      <button>Trigger a Global Error</button>
    </section>
  </main>

  <script>
    class CalculatorError extends Error {
      constructor(message) {
        super(message);
        this.name = "CalculatorError";
      }
    }

    let form = document.querySelector('form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      let output = document.querySelector('output');
      let firstNum = document.querySelector('#first-num').value;
      let secondNum = document.querySelector('#second-num').value;
      let operator = document.querySelector('#operator').value;

      try {
        if (isNaN(firstNum) || isNaN(secondNum) || firstNum === '' || secondNum === '') {
          throw new CalculatorError("Invalid Input: Both fields must contain valid numbers.");
        }
        if (operator === '/' && secondNum == 0) {
          throw new CalculatorError("Math Error: Cannot divide by zero.");
        }
        output.innerHTML = eval(`${firstNum} ${operator} ${secondNum}`);
      } catch (err) {

        console.error(`${err.name} caught: ${err.message}`);
        output.innerHTML = `Error: ${err.message}`;
      } finally {

        console.log("Calculator execution finished.");
      }
    });

    window.onerror = function (message, source, lineno, colno, error) {
      console.log("Global Error Caught!");
      console.log(`Message: ${message}`);
      return false; 
    };

    let errorBtns = Array.from(document.querySelectorAll('#error-btns > button'));

    errorBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        let action = btn.textContent;

        switch (action) {
          case 'Console Log':
            console.log("This is a standard log message.");
            break;
          case 'Console Error':
            console.error("This is a console error message.");
            break;
          case 'Console Count':
            console.count("Count Button Clicks");
            break;
          case 'Console Warn':
            console.warn("This is a console warning message.");
            break;
          case 'Console Assert':
            let a = 1;
            let b = 2;
            console.assert(a === b, "Assertion Failed: a does not equal b!");
            break;
          case 'Console Clear':
            console.clear();
            break;
          case 'Console Dir':
            console.dir(btn);
            break;
          case 'Console dirxml':
            console.dirxml(document.querySelector('form'));
            break;
          case 'Console Group Start':
            console.group("My Console Group");
            console.log("Inside the group!");
            break;
          case 'Console Group End':
            console.groupEnd("My Console Group");
            break;
          case 'Console Table':
            let classes = [
              { name: "Software Engineering", code: "CSE110" },
              { name: "Data Structures", code: "CSE100" }
            ];
            console.table(classes);
            break;
          case 'Start Timer':
            console.time("Demo Timer");
            break;
          case 'End Timer':
            console.timeEnd("Demo Timer");
            break;
          case 'Console Trace':
            const firstFunction = () => { 
              const secondFunction = () => { 
                console.trace("Tracing the function call path!"); 
              }; 
              secondFunction(); 
            };
            firstFunction();
            break;
          case 'Trigger a Global Error':

            thisVariableIsUndefinedAndWillCrash();
            break;
        }
      });
    });

  </script>

</body>
